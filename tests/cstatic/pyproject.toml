[project]
name = "tvm-cstatic-tests"
version = "0.1.0"
requires-python = ">=3.8"

dependencies = [
    # Core testing framework
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",  # Parallel test execution

    # Scientific computing
    "numpy>=1.20.0",
    "pandas>=1.3.0",  # Data analysis

    # PyTorch ecosystem (for model tests)
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # ONNX support
    "onnx>=1.12.0",

    # Image processing
    "Pillow>=9.0.0",
    "opencv-python>=4.5.0",  # Required by mmcv

    # Visualization and progress tracking
    "matplotlib>=3.3.0",  # Visualization
    "tqdm>=4.64.0",       # Progress bars

    # HTTP requests (for downloading test images)
    "requests>=2.28.0",

    # Additional dependencies for MMDetection
    "yapf>=0.40.1",  # Code formatting (used by mmcv)

    # For running od_rtmdet_pure.py
    "rtmdet",
]

[project.optional-dependencies]
dev = [
    # Additional development tools
    "ruff>=0.1.0",  # Linting and formatting
    "mypy>=1.0.0",  # Type checking
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "quick: marks tests as quick",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools]
# This is a test suite, not a distributable package
# Only include utility modules, exclude test files and data directories
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
