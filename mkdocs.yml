site_name: TVM for TI C7™ NPU
docs_dir: docs-c7x
use_directory_urls: false

theme:
  name: material
  logo: img/ti_logo.png
  favicon: img/favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Open Sans
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: user-guide/getting-started.md
    - Deploying Firmware: user-guide/deploying-firmware.md
    - Quantization: user-guide/quantization.md
    - Compilation: user-guide/compilation.md
    - Examples (YOLO26 & ResNet-18): user-guide/examples.md
    - Python / C++ API Reference: user-guide/python-api.md
  - Contributor Guide:
    - Architecture Overview: contributor-guide/architecture-overview.md
    - Backend:
      - C Static Lib Backend: contributor-guide/backend/c-static-lib.md
      - MMALIB Integration: contributor-guide/backend/mmalib-integration.md
      - TIDL Integration: contributor-guide/backend/tidl-integration.md
      - Authoring Passes: contributor-guide/backend/authoring-passes.md
      - te.extern Lowering: contributor-guide/backend/te-extern-lowering.md
      - CodeGenCStaticLib Internals: contributor-guide/backend/codegen-cstatic.md
      - Extending Quantizer: contributor-guide/backend/extending-quantizer.md
      - Debugging Passes: contributor-guide/backend/debugging-passes.md
    - DSP Runtime:
      - Runtime Internals: contributor-guide/dsp-runtime/internals.md
    - Firmware:
      - Firmware Architecture: contributor-guide/firmware/architecture.md
      - Firmware Design Deep-Dive: contributor-guide/firmware/design-deep-dive.md
    - Testing:
      - Overview: contributor-guide/testing/overview.md
      - DSP Suite: contributor-guide/testing/dsp-suite.md
      - Verifying Your Deployment: contributor-guide/testing/verifying-deployment.md
      - PT2E Quantizer Suite: contributor-guide/testing/pt2e-suite.md
      - Quantized Model Sweep: contributor-guide/testing/quantized-sweep.md
